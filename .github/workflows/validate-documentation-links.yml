name: Validate Documentation Links

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  check-broken-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check broken Paths
        uses: john0isaac/action-check-markdown@c255625e4ae89924a5f39a440a22e51fcc9f5893 # v1.3.1
        with:
          command: check_broken_paths
          directory: ./
          guide-url: 'https://github.com/Azure-Samples/eShopLite/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  check-urls-locale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check URLs Country Locale
        uses: john0isaac/action-check-markdown@c255625e4ae89924a5f39a440a22e51fcc9f5893 # v1.3.1
        with:
          command: check_urls_locale
          directory: ./
          # AG-UI is a protocol name, not a country locale.
          skip-urls-containing: 'https://learn.microsoft.com/agent-framework/integrations/by-component/ui/ag-ui/'
          guide-url: 'https://github.com/Azure-Samples/eShopLite/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  check-broken-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check broken URLs
        uses: john0isaac/action-check-markdown@c255625e4ae89924a5f39a440a22e51fcc9f5893 # v1.3.1
        with:
          command: check_broken_urls
          directory: ./
          guide-url: 'https://github.com/Azure-Samples/eShopLite/blob/main/CONTRIBUTING.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}
